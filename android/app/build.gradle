plugins {
    id "com.android.application"
}

// The app is a Trusted Web Activity: a thin native shell that opens the
// live web app (in Chrome, full screen) — so it always runs the latest
// version and keeps Google sign-in, offline mode and sync.
// The URLs themselves are in res/values/strings.xml.
def siteHost = "akrishna87.github.io"

android {
    namespace "io.github.akrishna87.rssreader"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.akrishna87.rssreader"
        minSdk 21
        targetSdk 34
        // CI passes the workflow run number so every build installs over the last.
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "0")

        manifestPlaceholders = [hostName: siteHost]
    }

    signingConfigs {
        release {
            // Key is committed encrypted (PKCS12, AES-256); the password lives in
            // the ANDROID_KEYSTORE_PASSWORD repository secret.
            storeFile file("release.p12")
            storeType "pkcs12"
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias "rssreader"
            keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
