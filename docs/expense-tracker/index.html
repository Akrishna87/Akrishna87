<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Expense Tracker</title>

<!-- Android / Chrome: installable PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d1426" />

<!-- iOS Safari: "Add to Home Screen" support (iOS ignores the manifest above) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Expenses" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />

<style>
:root {
  color-scheme: light dark;
  --bg: #0a0f1f;
  --bg-2: #0d1426;
  --panel: #141b34;
  --panel-2: #182150;
  --panel-border: rgba(255, 255, 255, 0.07);
  --text: #f3f5fc;
  --muted: #8b96bd;
  --accent: #45d6b0;
  --accent-2: #35a8ff;
  --accent-text: #052018;
  --income: #45d6b0;
  --expense: #ff9466;
  --danger: #ff6b6b;
  --well: #0e1530;
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.28);
  --shadow-lg: 0 18px 40px -14px rgba(0, 0, 0, 0.6);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 12% -10%, rgba(69, 214, 176, 0.16), transparent 45%),
    radial-gradient(circle at 100% 0%, rgba(53, 168, 255, 0.12), transparent 40%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  padding: 22px 16px 108px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.app-header {
  max-width: 860px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: left;
}
.brand-badge {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: linear-gradient(155deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  font-weight: 800;
  color: #04261d;
  box-shadow: 0 8px 20px -6px rgba(69, 214, 176, 0.55);
}
.app-header h1 {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.subtitle { margin: 2px 0 0; color: var(--muted); font-size: 0.82rem; }

main { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.panel {
  background: linear-gradient(175deg, var(--panel-2) 0%, var(--panel) 60%);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow-sm);
  animation: fadeInUp 0.22s ease both;
}
.panel h2 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em; }
.panel h3 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 700; }
.panel-hint { color: var(--muted); font-size: 0.8rem; margin: 0 0 12px; line-height: 1.45; }

select, input, textarea, button {
  font: inherit;
  font-size: 16px;
  background: var(--well);
  color: var(--text);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 10px 13px;
  min-width: 0;
  max-width: 100%;
}
button {
  background: linear-gradient(155deg, var(--accent), #33c39a);
  color: var(--accent-text);
  border: none;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 18px -8px rgba(69, 214, 176, 0.55);
  transition: transform 0.08s ease, filter 0.15s ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: scale(0.97); }
button.secondary { background: var(--well); color: var(--text); border: 1px solid var(--panel-border); box-shadow: none; }
button.danger { background: linear-gradient(155deg, var(--danger), #e05252); color: #2c0a0a; box-shadow: 0 8px 18px -8px rgba(255, 107, 107, 0.5); }
button.small { padding: 6px 11px; font-size: 0.8rem; border-radius: 10px; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.form-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

.type-toggle { display: flex; gap: 8px; margin-bottom: 16px; background: var(--well); padding: 4px; border-radius: 14px; border: 1px solid var(--panel-border); }
.type-toggle button { flex: 1; background: transparent; color: var(--muted); box-shadow: none; border-radius: 10px; }
.type-toggle button.income.active { background: var(--income); color: #06301f; box-shadow: 0 4px 12px -4px rgba(69, 214, 176, 0.6); }
.type-toggle button.expense.active { background: var(--expense); color: #3a1400; box-shadow: 0 4px 12px -4px rgba(255, 148, 102, 0.6); }

input.amount-input { font-size: 2rem; font-weight: 800; padding: 16px 14px; letter-spacing: -0.02em; }

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--well);
  color: var(--text);
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  padding: 9px 15px;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: none;
  transition: transform 0.08s ease;
}
.chip:active { transform: scale(0.96); }
.chip.active { background: var(--expense); color: #3a1400; border-color: var(--expense); box-shadow: 0 6px 14px -6px rgba(255, 148, 102, 0.6); }

button.link-toggle {
  background: transparent;
  border: none;
  color: var(--accent-2);
  font-weight: 700;
  padding: 8px 0 4px;
  cursor: pointer;
  text-align: left;
  display: block;
  box-shadow: none;
}

.icon-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: rgba(69, 214, 176, 0.14);
  font-size: 1.05rem;
  flex: 0 0 auto;
}
.icon-badge.lg { width: 44px; height: 44px; font-size: 1.3rem; border-radius: 13px; }
.icon-badge.tint-expense { background: rgba(255, 148, 102, 0.16); }
.icon-badge.tint-income { background: rgba(69, 214, 176, 0.16); }
.icon-badge.tint-danger { background: rgba(255, 107, 107, 0.16); }

.repeat-card { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.repeat-card .repeat-body { flex: 1 1 160px; min-width: 0; }
.repeat-card .repeat-label { font-weight: 800; font-size: 0.92rem; }
.repeat-card .repeat-summary { color: var(--muted); font-size: 0.84rem; margin-top: 2px; }
.repeat-card .repeat-confirm { font-weight: 700; color: var(--income); flex: 1 1 auto; }

.fab {
  position: fixed;
  bottom: 92px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 20px;
  background: linear-gradient(155deg, var(--expense), #ff7940);
  color: #2c0e00;
  font-size: 1.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 14px 30px -8px rgba(255, 121, 64, 0.65);
  z-index: 50;
  padding: 0;
  transition: transform 0.1s ease;
}
.fab:active { transform: scale(0.92); }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.summary-card {
  background: var(--well);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.summary-card .label { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
.summary-card .value { font-size: 1.35rem; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.summary-card.income .value { color: var(--income); }
.summary-card.expense .value { color: var(--expense); }

.month-picker { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.month-picker input[type="month"] { flex: 0 0 auto; }

.due-card {
  border: 1px solid rgba(69, 214, 176, 0.35);
  background: linear-gradient(175deg, rgba(69, 214, 176, 0.14), var(--panel) 65%);
}
.due-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  background: var(--well);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 10px;
}
.due-item .due-info { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.due-item .due-name { font-weight: 700; }
.due-item .due-meta { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.due-item .due-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.due-item .due-controls input { width: 110px; }
.due-item .due-controls input[type="date"] { width: 140px; }

.cat-row, .rec-row, .pm-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--well);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 10px 12px;
  margin-top: 8px;
}
.cat-row .cat-name, .rec-row .rec-name { font-weight: 700; flex: 1 1 auto; min-width: 90px; }
.cat-row .cat-budget, .rec-row .rec-meta { color: var(--muted); font-size: 0.78rem; }
.row-actions { display: flex; gap: 6px; margin-left: auto; }

.budget-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 6px; gap: 10px; }
.budget-row .cat-label { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.budget-track { background: var(--well); border-radius: 999px; height: 9px; overflow: hidden; border: 1px solid var(--panel-border); }
.budget-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.3s ease; }
.budget-fill.warn { background: #f4c860; }
.budget-fill.over { background: var(--danger); }
.cat-block { margin-bottom: 16px; }
.cat-block:last-child { margin-bottom: 0; }

.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.filter-bar > * { flex: 1 1 140px; min-width: 0; }

.entry-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--well);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 12px;
  margin-top: 8px;
}
.entry-row .entry-main { flex: 1 1 auto; min-width: 0; }
.entry-row .entry-title { font-weight: 700; }
.entry-row .entry-sub { color: var(--muted); font-size: 0.76rem; margin-top: 2px; }
.entry-row .entry-amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry-row .entry-amount.income { color: var(--income); }
.entry-row .entry-amount.expense { color: var(--expense); }
.entry-row .entry-actions { display: flex; gap: 6px; }

.empty-hint { color: var(--muted); text-align: center; padding: 18px 14px; font-size: 0.88rem; }

.account-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.account-line a { color: var(--accent-2); text-decoration: none; cursor: pointer; font-weight: 600; }

.app-footer { max-width: 860px; margin: 20px auto 0; text-align: center; color: var(--muted); font-size: 0.74rem; opacity: 0.8; }

.tab-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  justify-content: space-around;
  gap: 2px;
  background: rgba(15, 20, 40, 0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--panel-border);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -12px 30px rgba(0, 0, 0, 0.35);
}
.tab-btn {
  flex: 1 1 0;
  max-width: 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: transparent;
  border: none;
  box-shadow: none;
  color: var(--muted);
  padding: 6px 2px;
  border-radius: 12px;
  font-weight: 700;
}
.tab-btn:active { transform: scale(0.95); }
.tab-icon { font-size: 1.2rem; line-height: 1; }
.tab-label { font-size: 0.65rem; letter-spacing: 0.01em; }
.tab-btn.active { color: var(--accent); background: rgba(69, 214, 176, 0.14); }

@media (max-width: 600px) {
  body { padding: 16px 10px 112px; }
  .app-header h1 { font-size: 1.15rem; }
  .panel { padding: 15px; border-radius: 16px; }
  .entry-row { flex-wrap: wrap; }
  .entry-row .entry-amount { order: 3; margin-left: auto; }
}
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand-badge">₹</div>
    <div>
      <h1>Expense Tracker</h1>
      <p class="subtitle">Two incomes, recurring bills, category budgets.</p>
    </div>
  </header>

  <nav class="tab-bar" id="tabBar"></nav>

  <main id="app"></main>

  <footer class="app-footer">
    <p>Data is stored on this device. Cloud sync (optional) needs your own Google sign-in project — see the README.</p>
  </footer>

<script>
(function () {
"use strict";

var STORAGE_KEY = "expenseTracker.v1";

// ---- Optional cross-device sync (Firebase Firestore + Google Sign-In) ----
// Leave this null to keep the app exactly as it is: fully local, no internet
// dependency, data stays on this one device/browser. Fill it in with your
// own Firebase project's config (Firebase console -> Project settings ->
// your web app) to sync your ledger across every device where you sign in
// with the same Google account. See README.md for the full setup steps.
var FIREBASE_CONFIG = null;
var FIREBASE_SDK_VERSION = "10.14.1";
var REQUIRE_SIGN_IN = true;

var cloud = { docRef: null, setDoc: null, ready: false, failed: false };
var applyingRemoteUpdate = false;
var authApi = { signIn: null, signOut: null };
var authState = {
  required: !!(FIREBASE_CONFIG && REQUIRE_SIGN_IN),
  ready: false,
  user: null
};

function initFirebase() {
  if (!FIREBASE_CONFIG) return;
  var imports = [
    import("https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/firebase-firestore.js")
  ];
  if (authState.required) {
    imports.push(import("https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/firebase-auth.js"));
  }
  Promise.all(imports).then(function (mods) {
    var appMod = mods[0], fsMod = mods[1], authMod = mods[2];
    var app = appMod.initializeApp(FIREBASE_CONFIG);
    var db = fsMod.getFirestore(app);

    if (!authState.required) {
      cloud.docRef = fsMod.doc(db, "expenseTracker", "default");
      cloud.setDoc = fsMod.setDoc;
      startFirestoreSync(fsMod);
      return;
    }

    var authInst = authMod.getAuth(app);
    authApi.signIn = function () {
      authMod.signInWithPopup(authInst, new authMod.GoogleAuthProvider()).catch(function (err) {
        console.warn("Cloud sync: sign-in failed", err);
      });
    };
    authApi.signOut = function () { authMod.signOut(authInst); };

    authMod.onAuthStateChanged(authInst, function (user) {
      authState.ready = true;
      authState.user = user || null;
      if (user) {
        var myEmail = (user.email || "").toLowerCase();
        cloud.docRef = fsMod.doc(db, "expenseTracker", myEmail);
        cloud.setDoc = fsMod.setDoc;
        startFirestoreSync(fsMod);
      } else {
        cloud.ready = false;
        render();
      }
    });
  }).catch(function (err) {
    console.warn("Cloud sync: unavailable", err);
    cloud.failed = true;
    authState.ready = true;
    render();
  });
}

function startFirestoreSync(fsMod) {
  cloud.ready = true;
  cloud.failed = false;
  render();
  fsMod.onSnapshot(cloud.docRef, function (snap) {
    if (!snap.exists()) {
      pushCloudUpdate();
      return;
    }
    var remote = snap.data();
    if (JSON.stringify(remote) === JSON.stringify(state)) return;
    applyingRemoteUpdate = true;
    state = remote;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    render();
    applyingRemoteUpdate = false;
  }, function (err) {
    console.warn("Cloud sync: listen failed", err);
    cloud.ready = false;
    cloud.failed = true;
    render();
  });
}

function pushCloudUpdate() {
  if (!cloud.ready || applyingRemoteUpdate) return;
  cloud.setDoc(cloud.docRef, state).catch(function (err) {
    console.warn("Cloud sync: push failed", err);
  });
}

// ---------- Defaults ----------

var DEFAULT_CATEGORIES = [
  { id: "housing", name: "Housing / Rent", emoji: "🏠", budget: 0 },
  { id: "loan", name: "Loan EMI", emoji: "🏦", budget: 0 },
  { id: "investment", name: "Mutual Fund", emoji: "📈", budget: 0 },
  { id: "rd", name: "RD", emoji: "💵", budget: 0 },
  { id: "electricity", name: "EB Bill", emoji: "💡", budget: 0 },
  { id: "groceries", name: "Groceries", emoji: "🛒", budget: 0 },
  { id: "transport", name: "Transport", emoji: "🚗", budget: 0 },
  { id: "dining", name: "Dining Out", emoji: "🍔", budget: 0 },
  { id: "utilities", name: "Utilities", emoji: "🔧", budget: 0 },
  { id: "healthcare", name: "Healthcare", emoji: "🩺", budget: 0 },
  { id: "shopping", name: "Shopping", emoji: "🛍️", budget: 0 },
  { id: "entertainment", name: "Entertainment", emoji: "🎬", budget: 0 },
  { id: "other", name: "Other", emoji: "❔", budget: 0 }
];

var DEFAULT_PAYMENT_METHODS = ["Cash", "Card", "UPI", "Bank Transfer", "Other"];

var EMOJI_PALETTE = ["🏠","🏦","📈","💵","💡","🛒","🚗","🍔","🔧","🩺","🛍️","🎬","📱","🎓","🐾","✈️","🎁","❔","💼","💳"];

var INTERVAL_OPTIONS = [
  { value: 1, label: "Every month" },
  { value: 2, label: "Every 2 months" },
  { value: 3, label: "Every 3 months" },
  { value: 6, label: "Every 6 months" },
  { value: 12, label: "Every year" }
];

var TABS = [
  { id: "dashboard", icon: "📊", label: "Dashboard" },
  { id: "add", icon: "➕", label: "Add" },
  { id: "recurring", icon: "🔁", label: "Recurring" },
  { id: "history", icon: "📜", label: "History" },
  { id: "settings", icon: "⚙️", label: "Settings" }
];

// ---------- State ----------

function loadState() {
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (raw) {
    try {
      var parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.categories)) return parsed;
    } catch (e) {}
  }
  return {
    currencySymbol: "₹",
    categories: DEFAULT_CATEGORIES.map(function (c) { return Object.assign({}, c); }),
    paymentMethods: DEFAULT_PAYMENT_METHODS.slice(),
    recurringItems: [],
    entries: []
  };
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  pushCloudUpdate();
}

var state = loadState();
if (!state.currencySymbol) state.currencySymbol = "₹";
if (!Array.isArray(state.paymentMethods) || !state.paymentMethods.length) state.paymentMethods = DEFAULT_PAYMENT_METHODS.slice();
if (!Array.isArray(state.recurringItems)) state.recurringItems = [];
if (!Array.isArray(state.entries)) state.entries = [];

var currentTab = "dashboard";
try {
  if (new URLSearchParams(location.search).get("tab") === "add") currentTab = "add";
} catch (e) {}
var selectedMonth = currentMonthKey();
var entryDraft = null;      // being edited/created on the Add tab
var recurringDraft = null;  // being edited/created on the Recurring tab
var dueOverrides = {};      // periodKey -> { amount, date }
var lastRepeatConfirmation = null; // { entryId } - set right after "Repeat last expense" logs one
var historyFilter = { type: "all", categoryId: "all", month: "all", search: "" };
var editingCategoryId = null;
var newCategoryDraft = { name: "", emoji: "⭐", budget: "" };

// ---------- Date helpers ----------

function pad(n) { return n < 10 ? "0" + n : "" + n; }

function todayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}

function currentMonthKey() {
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1);
}

function monthKeyOfDate(dateStr) { return dateStr.slice(0, 7); }

function monthsBetween(startStr, todayStr) {
  var s = startStr.split("-").map(Number);
  var t = todayStr.split("-").map(Number);
  var months = (t[0] - s[0]) * 12 + (t[1] - s[1]);
  if (t[2] < s[2]) months -= 1;
  return months;
}

function addMonthsClamped(dateStr, n) {
  var parts = dateStr.split("-").map(Number);
  var y = parts[0], m = parts[1], d = parts[2];
  var targetIndex = (m - 1) + n;
  var targetYear = y + Math.floor(targetIndex / 12);
  var targetMonth = ((targetIndex % 12) + 12) % 12;
  var daysInTarget = new Date(targetYear, targetMonth + 1, 0).getDate();
  var clampedDay = Math.min(d, daysInTarget);
  return targetYear + "-" + pad(targetMonth + 1) + "-" + pad(clampedDay);
}

function formatDateLong(dateStr) {
  var parts = dateStr.split("-").map(Number);
  var d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function formatMoney(amount) {
  var n = Number(amount) || 0;
  return state.currencySymbol + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
}

function intervalLabel(n) {
  for (var i = 0; i < INTERVAL_OPTIONS.length; i++) {
    if (INTERVAL_OPTIONS[i].value === n) return INTERVAL_OPTIONS[i].label;
  }
  return "Every " + n + " months";
}

// ---------- Lookups ----------

function categoryById(id) {
  for (var i = 0; i < state.categories.length; i++) {
    if (state.categories[i].id === id) return state.categories[i];
  }
  return null;
}

function recurringById(id) {
  for (var i = 0; i < state.recurringItems.length; i++) {
    if (state.recurringItems[i].id === id) return state.recurringItems[i];
  }
  return null;
}

function mostRecentExpenseEntry() {
  for (var i = state.entries.length - 1; i >= 0; i--) {
    if (state.entries[i].type === "expense") return state.entries[i];
  }
  return null;
}

function genId(prefix) {
  return prefix + "_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
}

// ---------- Recurring due-period logic ----------

// Caps how many overdue periods of one recurring item we surface at once,
// so a bill left unopened for years doesn't flood the dashboard.
var MAX_PENDING_PER_RECURRING = 6;

function isPeriodLogged(recurringId, periodIndex) {
  return state.entries.some(function (e) { return e.recurringId === recurringId && e.periodIndex === periodIndex; });
}

function isPeriodSkipped(item, periodIndex) {
  return Array.isArray(item.skippedPeriods) && item.skippedPeriods.indexOf(periodIndex) >= 0;
}

function pendingPeriodsFor(item, todayStr) {
  var elapsed = monthsBetween(item.startDate, todayStr);
  if (elapsed < 0) return [];
  var maxIdx = Math.floor(elapsed / item.intervalMonths);
  var pending = [];
  for (var idx = maxIdx; idx >= 0 && pending.length < MAX_PENDING_PER_RECURRING; idx--) {
    var due = addMonthsClamped(item.startDate, idx * item.intervalMonths);
    if (due > todayStr) continue;
    if (isPeriodLogged(item.id, idx) || isPeriodSkipped(item, idx)) continue;
    pending.push({ periodIndex: idx, dueDate: due });
  }
  return pending.reverse();
}

function nextDueDateFor(item, todayStr) {
  var elapsed = monthsBetween(item.startDate, todayStr);
  var idx = elapsed < 0 ? 0 : Math.floor(elapsed / item.intervalMonths);
  while (idx >= 0 && (isPeriodLogged(item.id, idx) || isPeriodSkipped(item, idx))) {
    idx += 1;
  }
  return addMonthsClamped(item.startDate, idx * item.intervalMonths);
}

function allPendingItems() {
  var today = todayKey();
  var out = [];
  state.recurringItems.forEach(function (item) {
    pendingPeriodsFor(item, today).forEach(function (p) {
      out.push({ item: item, periodIndex: p.periodIndex, dueDate: p.dueDate });
    });
  });
  out.sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0); });
  return out;
}

function confirmDueItem(item, periodIndex, amount, date) {
  state.entries.push({
    id: genId("e"),
    type: item.type,
    amount: Number(amount) || 0,
    date: date,
    note: item.note || "",
    categoryId: item.type === "expense" ? item.categoryId : null,
    paymentMethod: item.type === "expense" ? item.paymentMethod : null,
    sourceName: item.type === "income" ? item.name : null,
    recurringId: item.id,
    periodIndex: periodIndex
  });
  delete dueOverrides[item.id + "_" + periodIndex];
  saveState();
  render();
}

function skipDueItem(item, periodIndex) {
  if (!Array.isArray(item.skippedPeriods)) item.skippedPeriods = [];
  if (item.skippedPeriods.indexOf(periodIndex) < 0) item.skippedPeriods.push(periodIndex);
  delete dueOverrides[item.id + "_" + periodIndex];
  saveState();
  render();
}

function repeatLastExpense() {
  var last = mostRecentExpenseEntry();
  if (!last) return;
  var entry = {
    id: genId("e"),
    type: "expense",
    amount: Number(last.amount),
    date: todayKey(),
    note: last.note || "",
    categoryId: last.categoryId,
    paymentMethod: last.paymentMethod,
    sourceName: null,
    recurringId: null,
    periodIndex: null
  };
  upsertEntry(entry);
  lastRepeatConfirmation = { entryId: entry.id };
  render();
}

// ---------- Entry / recurring / category mutations ----------

function upsertEntry(entry) {
  var idx = state.entries.findIndex(function (e) { return e.id === entry.id; });
  if (idx >= 0) state.entries[idx] = entry;
  else state.entries.push(entry);
  saveState();
}

function deleteEntry(id) {
  state.entries = state.entries.filter(function (e) { return e.id !== id; });
  saveState();
  render();
}

function upsertRecurring(item) {
  var idx = state.recurringItems.findIndex(function (r) { return r.id === item.id; });
  if (idx >= 0) state.recurringItems[idx] = item;
  else state.recurringItems.push(item);
  saveState();
}

function deleteRecurring(id) {
  state.recurringItems = state.recurringItems.filter(function (r) { return r.id !== id; });
  saveState();
  render();
}

function upsertCategory(cat) {
  var idx = state.categories.findIndex(function (c) { return c.id === cat.id; });
  if (idx >= 0) state.categories[idx] = cat;
  else state.categories.push(cat);
  saveState();
}

function deleteCategory(id) {
  state.categories = state.categories.filter(function (c) { return c.id !== id; });
  saveState();
  render();
}

// ---------- DOM helpers ----------

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function field(labelText, inputEl) {
  var wrap = el("div", "field");
  var label = el("label", null, escapeHtml(labelText));
  wrap.appendChild(label);
  wrap.appendChild(inputEl);
  return wrap;
}

function paymentMethodOptions() {
  var set = state.paymentMethods.slice();
  state.entries.forEach(function (e) {
    if (e.paymentMethod && set.indexOf(e.paymentMethod) < 0) set.push(e.paymentMethod);
  });
  return set;
}

var app = document.getElementById("app");
var tabBar = document.getElementById("tabBar");

var fab = document.createElement("button");
fab.type = "button";
fab.className = "fab";
fab.title = "Quick add expense";
fab.textContent = "➕";
fab.addEventListener("click", function () {

});
document.body.appendChild(fab);

function renderTabBar() {
  tabBar.innerHTML = "";

  });
}

function iconBadge(emoji, tint, size) {
  var span = el("span", "icon-badge" + (size ? " " + size : "") + (tint ? " tint-" + tint : ""), emoji);
  return span;
}

function render() {
  renderTabBar();
  var signedOut = authState.required && !authState.user;
  tabBar.style.display = signedOut ? "none" : "flex";

    renderSignIn();
    return;
  }

  switch (currentTab) {
    case "dashboard": renderDashboard(); break;
    case "add": renderAdd(); break;
    case "recurring": renderRecurring(); break;
    case "history": renderHistory(); break;
    case "settings": renderSettings(); break;

  }
}

function renderSignIn() {
  var panel = el("div", "panel");

    panel.appendChild(btn);
  }
  app.appendChild(panel);
}

function renderAccountLine() {
  var line = el("div", "account-line");
  var syncText = cloud.ready ? "☁️ Synced across devices" :
    (cloud.failed ? "💾 Saved on this device only (sync unavailable)" :
    (FIREBASE_CONFIG ? "🔌 Connecting…" : "💾 Saved on this device only"));

  if (authState.required && authState.user) {
    line.appendChild(el("span", null, "· " + escapeHtml(authState.user.email)));

// ----- Dashboard -----

function renderRepeatCard() {
  var lastExpense = mostRecentExpenseEntry();
  if (!lastExpense) return null;
  var cat = categoryById(lastExpense.categoryId);
  var summary = (cat ? cat.name : "Expense") + " · " + formatMoney(lastExpense.amount) +
    (lastExpense.paymentMethod ? " · " + escapeHtml(lastExpense.paymentMethod) : "");

  var card = el("div", "panel repeat-card");
  if (lastRepeatConfirmation && lastRepeatConfirmation.entryId === lastExpense.id) {
    card.appendChild(iconBadge("✅", "income", "lg"));
    var confirmBody = el("div", "repeat-body");
    confirmBody.appendChild(el("div", "repeat-confirm", "Added " + summary));
    card.appendChild(confirmBody);
    var undoBtn = el("button", "small secondary", "Undo");
    undoBtn.addEventListener("click", function () {
      lastRepeatConfirmation = null;
      deleteEntry(lastExpense.id);
    });
    card.appendChild(undoBtn);
  } else {
    card.appendChild(iconBadge(cat ? cat.emoji : "💸", "expense", "lg"));
    var body = el("div", "repeat-body");
    body.appendChild(el("div", "repeat-label", "Repeat last expense"));
    body.appendChild(el("div", "repeat-summary", summary));
    card.appendChild(body);
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Log it again";
    btn.addEventListener("click", repeatLastExpense);
    card.appendChild(btn);
  }
  return card;
}

function renderDashboard() {
  app.appendChild(renderAccountLine());

  var repeatCard = renderRepeatCard();
  if (repeatCard) app.appendChild(repeatCard);

  var pending = allPendingItems();
  if (pending.length) {
    var dueCard = el("div", "panel due-card");
    dueCard.appendChild(el("h2", null, "🔔 Due now (" + pending.length + ")"));
    dueCard.appendChild(el("p", "panel-hint", "Recurring items that are due. Confirm to log them, or skip this one period."));
    pending.forEach(function (p) {
      dueCard.appendChild(renderDueItem(p.item, p.periodIndex, p.dueDate));
    });
    app.appendChild(dueCard);
  }

  var summaryPanel = el("div", "panel");
  var monthPicker = el("div", "month-picker");
  var monthLabel = el("label", null, "Month:");
  var monthInput = document.createElement("input");
  monthInput.type = "month";
  monthInput.value = selectedMonth;
  monthInput.addEventListener("change", function () {
    if (monthInput.value) selectedMonth = monthInput.value;
    render();
  });
  monthPicker.appendChild(monthLabel);
  monthPicker.appendChild(monthInput);
  summaryPanel.appendChild(monthPicker);

  var monthEntries = state.entries.filter(function (e) { return monthKeyOfDate(e.date) === selectedMonth; });
  var totalIncome = monthEntries.filter(function (e) { return e.type === "income"; }).reduce(function (s, e) { return s + Number(e.amount); }, 0);
  var totalExpense = monthEntries.filter(function (e) { return e.type === "expense"; }).reduce(function (s, e) { return s + Number(e.amount); }, 0);

  var grid = el("div", "summary-grid");
  var incomeCard = el("div", "summary-card income");
  incomeCard.appendChild(iconBadge("💰", "income"));
  var incomeBody = el("div");
  incomeBody.appendChild(el("div", "label", "Income"));
  incomeBody.appendChild(el("div", "value", formatMoney(totalIncome)));
  incomeCard.appendChild(incomeBody);

  var expenseCard = el("div", "summary-card expense");
  expenseCard.appendChild(iconBadge("💸", "expense"));
  var expenseBody = el("div");
  expenseBody.appendChild(el("div", "label", "Expenses"));
  expenseBody.appendChild(el("div", "value", formatMoney(totalExpense)));
  expenseCard.appendChild(expenseBody);

  var net = totalIncome - totalExpense;
  var netCard = el("div", "summary-card");
  netCard.appendChild(iconBadge("⚖️", net >= 0 ? "income" : "expense"));
  var netBody = el("div");
  netBody.appendChild(el("div", "label", "Net"));
  var netValue = el("div", "value", formatMoney(net));
  netValue.style.color = net >= 0 ? "var(--income)" : "var(--expense)";
  netBody.appendChild(netValue);
  netCard.appendChild(netBody);

  grid.appendChild(incomeCard);
  grid.appendChild(expenseCard);
  grid.appendChild(netCard);
  summaryPanel.appendChild(grid);
  app.appendChild(summaryPanel);

  var catPanel = el("div", "panel");
  catPanel.appendChild(el("h2", null, "📊 Category breakdown"));
  var expenseEntries = monthEntries.filter(function (e) { return e.type === "expense"; });
  if (!expenseEntries.length) {
    catPanel.appendChild(el("div", "empty-hint", "No expenses logged for this month yet."));
  } else {
    var byCategory = {};
    expenseEntries.forEach(function (e) {
      byCategory[e.categoryId] = (byCategory[e.categoryId] || 0) + Number(e.amount);
    });
    Object.keys(byCategory)
      .sort(function (a, b) { return byCategory[b] - byCategory[a]; })
      .forEach(function (catId) {
        var cat = categoryById(catId) || { name: "(deleted category)", emoji: "❓", budget: 0 };
        var spent = byCategory[catId];
        var block = el("div", "cat-block");
        var row = el("div", "budget-row");
        var catLabelEl = el("div", "cat-label");
        catLabelEl.appendChild(iconBadge(cat.emoji));
        catLabelEl.appendChild(document.createTextNode(cat.name));
        row.appendChild(catLabelEl);
        var amountText = cat.budget > 0 ? formatMoney(spent) + " / " + formatMoney(cat.budget) : formatMoney(spent);
        row.appendChild(el("div", null, amountText));
        block.appendChild(row);
        var track = el("div", "budget-track");
        var fill = el("div", "budget-fill");
        var pct = cat.budget > 0 ? Math.min((spent / cat.budget) * 100, 100) : Math.min((spent / (spent || 1)) * 100, 100);
        fill.style.width = pct + "%";
        if (cat.budget > 0) {
          if (spent > cat.budget) fill.classList.add("over");
          else if (spent >= cat.budget * 0.8) fill.classList.add("warn");
        }
        track.appendChild(fill);
        block.appendChild(track);
        catPanel.appendChild(block);
      });
  }
  app.appendChild(catPanel);
}

function renderDueItem(item, periodIndex, dueDate) {
  var key = item.id + "_" + periodIndex;
  if (!dueOverrides[key]) dueOverrides[key] = { amount: item.amount, date: dueDate };
  var draft = dueOverrides[key];

  var row = el("div", "due-item");
  var info = el("div", "due-info");
  info.appendChild(iconBadge(item.type === "income" ? "💰" : "💸", item.type));
  var dueText = el("div");
  dueText.appendChild(el("div", "due-name", escapeHtml(item.name)));
  var catLabel = item.type === "expense" ? (categoryById(item.categoryId) || { name: "Other" }).name + " · " : "";
  dueText.appendChild(el("div", "due-meta", catLabel + "Due " + formatDateLong(dueDate) + " · " + intervalLabel(item.intervalMonths)));
  info.appendChild(dueText);
  row.appendChild(info);

  var controls = el("div", "due-controls");
  var amountIn = document.createElement("input");
  amountIn.type = "number";
  amountIn.step = "0.01";
  amountIn.value = draft.amount;
  amountIn.addEventListener("input", function () { draft.amount = amountIn.value; });
  controls.appendChild(amountIn);

  var dateIn = document.createElement("input");
  dateIn.type = "date";
  dateIn.value = draft.date;
  dateIn.addEventListener("input", function () { draft.date = dateIn.value; });
  controls.appendChild(dateIn);

  var confirmBtn = el("button", "small", "✅ Log it");
  confirmBtn.addEventListener("click", function () {
    confirmDueItem(item, periodIndex, amountIn.value, dateIn.value);
  });
  controls.appendChild(confirmBtn);

  var skipBtn = el("button", "small secondary", "Skip");
  skipBtn.addEventListener("click", function () { skipDueItem(item, periodIndex); });
  controls.appendChild(skipBtn);

  row.appendChild(controls);
  return row;
}

// ----- Add -----

function blankEntryDraft() {
  var last = mostRecentExpenseEntry();
  var lastCategoryValid = last && categoryById(last.categoryId);
  return {
    id: null,
    type: "expense",
    amount: "",
    date: todayKey(),
    categoryId: lastCategoryValid ? last.categoryId : (state.categories[0] ? state.categories[0].id : ""),
    paymentMethod: (last && last.paymentMethod) ? last.paymentMethod : (state.paymentMethods[0] || ""),
    sourceName: "",
    note: "",
    _showMore: false
  };
}

function renderAdd() {
  if (!entryDraft) entryDraft = blankEntryDraft();
  var panel = el("div", "panel");
  panel.appendChild(el("h2", null, entryDraft.id ? "✏️ Edit entry" : "➕ Add entry"));

  var toggle = el("div", "type-toggle");

    pmOptions.forEach(function (pm) {
      var chip = el("button", "chip" + (pm === entryDraft.paymentMethod ? " active" : ""), escapeHtml(pm));
      chip.type = "button";
      chip.addEventListener("click", function () { entryDraft.paymentMethod = pm; render(); });
      pmChips.appendChild(chip);
    });
    var customChip = el("button", "chip", "+ Custom");

  if (!entryDraft._showMore) {

    panel.appendChild(moreBtn);

    var dateIn = document.createElement("input");
    dateIn.type = "date";

    dateIn.addEventListener("input", function () { entryDraft.date = dateIn.value; });
    moreGrid.appendChild(field("Date", dateIn));

    var noteIn = document.createElement("input");
    noteIn.type = "text";
    noteIn.placeholder = "optional note";
    noteIn.value = entryDraft.note || "";
    noteIn.addEventListener("input", function () { entryDraft.note = noteIn.value; });
    moreGrid.appendChild(field("Note", noteIn));
    panel.appendChild(moreGrid);

    if (entryDraft.type === "income" && !entryDraft.sourceName.trim()) return;
    var entry = {
      id: entryDraft.id || genId("e"),
      type: entryDraft.type,
      amount: Number(entryDraft.amount),
      date: entryDraft.date,
      note: entryDraft.note || "",
      categoryId: entryDraft.type === "expense" ? entryDraft.categoryId : null,
      paymentMethod: entryDraft.type === "expense" ? (entryDraft.paymentMethod || "") : null,

    actions.appendChild(cancelBtn);
  }
  panel.appendChild(actions);
  app.appendChild(panel);

  if (!entryDraft.id) amountIn.focus();
}

// ----- Recurring -----

function blankRecurringDraft() {
  return {
    id: null,
    type: "expense",
    name: "",
    amount: "",
    categoryId: state.categories[0] ? state.categories[0].id : "",
    paymentMethod: state.paymentMethods[0] || "",
    intervalMonths: 1,
    startDate: todayKey(),
    note: "",
    skippedPeriods: []
  };
}

function renderRecurring() {
  app.appendChild(renderAccountLine());

  var listPanel = el("div", "panel");
  listPanel.appendChild(el("h2", null, "🔁 Recurring incomes & expenses"));
  listPanel.appendChild(el("p", "panel-hint", "Monthly EMIs, SIPs, RD, bi-monthly EB bills, or your regular salaries — add them once and confirm each due period from the Dashboard."));

  if (!state.recurringItems.length) {
    listPanel.appendChild(el("div", "empty-hint", "No recurring items yet."));
  } else {
    var today = todayKey();
    state.recurringItems
      .slice()
      .sort(function (a, b) { return a.name.localeCompare(b.name); })
      .forEach(function (item) {
        var row = el("div", "rec-row");
        row.appendChild(iconBadge(item.type === "income" ? "💰" : "💸", item.type));
        var recBody = el("div");
        recBody.style.flex = "1 1 auto";
        recBody.style.minWidth = "120px";
        var nameWrap = el("div", "rec-name", escapeHtml(item.name));
        recBody.appendChild(nameWrap);
        var catText = item.type === "expense" ? ((categoryById(item.categoryId) || { name: "Other" }).name + " · ") : "";
        var meta = el("div", "rec-meta", catText + formatMoney(item.amount) + " · " + intervalLabel(item.intervalMonths) + " · next " + formatDateLong(nextDueDateFor(item, today)));
        recBody.appendChild(meta);
        row.appendChild(recBody);

        var actions = el("div", "row-actions");
        var editBtn = el("button", "small secondary", "Edit");
        editBtn.addEventListener("click", function () { recurringDraft = Object.assign({}, item); render(); });
        var delBtn = el("button", "small danger", "Delete");
        delBtn.addEventListener("click", function () {
          if (confirm('Delete recurring item "' + item.name + '"? Past logged entries stay in your history.')) deleteRecurring(item.id);
        });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);
        listPanel.appendChild(row);
      });
  }
  app.appendChild(listPanel);

  if (!recurringDraft) recurringDraft = blankRecurringDraft();
  var formPanel = el("div", "panel");
  formPanel.appendChild(el("h3", null, recurringDraft.id ? "Edit recurring item" : "Add recurring item"));

  var toggle = el("div", "type-toggle");
  var incBtn = el("button", "income" + (recurringDraft.type === "income" ? " active" : ""), "💰 Income");
  incBtn.type = "button";
  incBtn.addEventListener("click", function () { recurringDraft.type = "income"; render(); });
  var expBtn = el("button", "expense" + (recurringDraft.type === "expense" ? " active" : ""), "💸 Expense");
  expBtn.type = "button";
  expBtn.addEventListener("click", function () { recurringDraft.type = "expense"; render(); });
  toggle.appendChild(incBtn);
  toggle.appendChild(expBtn);
  formPanel.appendChild(toggle);

  var form = el("form", "form-grid");

  var nameIn = document.createElement("input");
  nameIn.type = "text";
  nameIn.placeholder = recurringDraft.type === "income" ? "e.g. Salary – Primary" : "e.g. Home Loan EMI";
  nameIn.value = recurringDraft.name;
  nameIn.addEventListener("input", function () { recurringDraft.name = nameIn.value; });
  form.appendChild(field("Name", nameIn));

  var amountIn = document.createElement("input");
  amountIn.type = "number";
  amountIn.step = "0.01";
  amountIn.min = "0";
  amountIn.value = recurringDraft.amount;
  amountIn.addEventListener("input", function () { recurringDraft.amount = amountIn.value; });
  form.appendChild(field("Amount", amountIn));

  if (recurringDraft.type === "expense") {
    var catSelect = document.createElement("select");
    state.categories.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.emoji + " " + c.name;
      if (c.id === recurringDraft.categoryId) o.selected = true;
      catSelect.appendChild(o);
    });
    catSelect.addEventListener("change", function () { recurringDraft.categoryId = catSelect.value; });
    form.appendChild(field("Category", catSelect));

    var pmInput = document.createElement("input");
    pmInput.setAttribute("list", "recPaymentMethodList");
    pmInput.value = recurringDraft.paymentMethod || "";
    pmInput.addEventListener("input", function () { recurringDraft.paymentMethod = pmInput.value; });
    form.appendChild(field("Payment method", pmInput));

    var datalist = document.createElement("datalist");
    datalist.id = "recPaymentMethodList";
    paymentMethodOptions().forEach(function (pm) {
      var o = document.createElement("option");
      o.value = pm;
      datalist.appendChild(o);
    });
    form.appendChild(datalist);
  }

  var intervalSelect = document.createElement("select");
  INTERVAL_OPTIONS.forEach(function (opt) {
    var o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    if (opt.value === recurringDraft.intervalMonths) o.selected = true;
    intervalSelect.appendChild(o);
  });
  intervalSelect.addEventListener("change", function () { recurringDraft.intervalMonths = Number(intervalSelect.value); });
  form.appendChild(field("Frequency", intervalSelect));

  var startIn = document.createElement("input");
  startIn.type = "date";
  startIn.value = recurringDraft.startDate;
  startIn.addEventListener("input", function () { recurringDraft.startDate = startIn.value; });
  form.appendChild(field("First due date", startIn));

  var noteIn = document.createElement("input");
  noteIn.type = "text";
  noteIn.placeholder = "optional note";
  noteIn.value = recurringDraft.note || "";
  noteIn.addEventListener("input", function () { recurringDraft.note = noteIn.value; });
  form.appendChild(field("Note", noteIn));

  formPanel.appendChild(form);

  var actions = el("div", "form-actions");
  var saveBtn = el("button", null, recurringDraft.id ? "Save changes" : "Add recurring item");
  saveBtn.type = "button";
  saveBtn.addEventListener("click", function () {
    if (!recurringDraft.name.trim() || !recurringDraft.amount || Number(recurringDraft.amount) <= 0 || !recurringDraft.startDate) return;
    var item = {
      id: recurringDraft.id || genId("r"),
      type: recurringDraft.type,
      name: recurringDraft.name.trim(),
      amount: Number(recurringDraft.amount),
      categoryId: recurringDraft.type === "expense" ? recurringDraft.categoryId : null,
      paymentMethod: recurringDraft.type === "expense" ? (recurringDraft.paymentMethod || "") : null,
      intervalMonths: Number(recurringDraft.intervalMonths),
      startDate: recurringDraft.startDate,
      note: recurringDraft.note || "",
      skippedPeriods: recurringDraft.skippedPeriods || []
    };
    upsertRecurring(item);
    recurringDraft = null;
    render();
  });
  actions.appendChild(saveBtn);

  var cancelBtn = el("button", "secondary", "Cancel");
  cancelBtn.type = "button";
  cancelBtn.addEventListener("click", function () { recurringDraft = null; render(); });
  actions.appendChild(cancelBtn);

  formPanel.appendChild(actions);
  app.appendChild(formPanel);
}

// ----- History -----

function renderHistory() {
  var panel = el("div", "panel");
  panel.appendChild(el("h2", null, "📜 History"));

  var filterBar = el("div", "filter-bar");

  var typeSelect = document.createElement("select");
  [["all", "All types"], ["income", "💰 Income"], ["expense", "💸 Expense"]].forEach(function (pair) {
    var o = document.createElement("option");
    o.value = pair[0];
    o.textContent = pair[1];
    if (pair[0] === historyFilter.type) o.selected = true;
    typeSelect.appendChild(o);
  });
  typeSelect.addEventListener("change", function () { historyFilter.type = typeSelect.value; render(); });
  filterBar.appendChild(typeSelect);

  var catSelect = document.createElement("select");
  var allCatOpt = document.createElement("option");
  allCatOpt.value = "all";
  allCatOpt.textContent = "All categories";
  catSelect.appendChild(allCatOpt);
  state.categories.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c.id;
    o.textContent = c.emoji + " " + c.name;
    if (c.id === historyFilter.categoryId) o.selected = true;
    catSelect.appendChild(o);
  });
  catSelect.addEventListener("change", function () { historyFilter.categoryId = catSelect.value; render(); });
  filterBar.appendChild(catSelect);

  var monthSelect = document.createElement("select");
  var allMonthOpt = document.createElement("option");
  allMonthOpt.value = "all";
  allMonthOpt.textContent = "All months";
  monthSelect.appendChild(allMonthOpt);
  var months = Array.from(new Set(state.entries.map(function (e) { return monthKeyOfDate(e.date); }))).sort().reverse();
  months.forEach(function (m) {
    var o = document.createElement("option");
    o.value = m;
    o.textContent = m;
    if (m === historyFilter.month) o.selected = true;
    monthSelect.appendChild(o);
  });
  monthSelect.addEventListener("change", function () { historyFilter.month = monthSelect.value; render(); });
  filterBar.appendChild(monthSelect);

  var searchIn = document.createElement("input");
  searchIn.type = "text";
  searchIn.placeholder = "Search notes…";
  searchIn.value = historyFilter.search;
  searchIn.addEventListener("input", function () { historyFilter.search = searchIn.value; render(); });
  filterBar.appendChild(searchIn);

  panel.appendChild(filterBar);

  var filtered = state.entries.filter(function (e) {
    if (historyFilter.type !== "all" && e.type !== historyFilter.type) return false;
    if (historyFilter.categoryId !== "all" && e.categoryId !== historyFilter.categoryId) return false;
    if (historyFilter.month !== "all" && monthKeyOfDate(e.date) !== historyFilter.month) return false;
    if (historyFilter.search.trim() && (e.note || "").toLowerCase().indexOf(historyFilter.search.trim().toLowerCase()) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });

  if (!filtered.length) {
    panel.appendChild(el("div", "empty-hint", "No entries match these filters."));
  } else {
    filtered.forEach(function (e) {
      var row = el("div", "entry-row");
      var cat = e.type === "expense" ? categoryById(e.categoryId) : null;
      row.appendChild(iconBadge(e.type === "income" ? "💰" : (cat ? cat.emoji : "💸"), e.type));
      var main = el("div", "entry-main");
      var title = e.type === "income" ? (e.sourceName || "Income") : (cat ? cat.name : "(deleted category)");
      main.appendChild(el("div", "entry-title", escapeHtml(title)));
      var subParts = [formatDateLong(e.date)];
      if (e.type === "expense" && e.paymentMethod) subParts.push(e.paymentMethod);
      if (e.recurringId) {
        var rec = recurringById(e.recurringId);
        subParts.push(rec ? "🔁 " + escapeHtml(rec.name) : "🔁 recurring");
      }
      if (e.note) subParts.push(escapeHtml(e.note));
      main.appendChild(el("div", "entry-sub", subParts.join(" · ")));
      row.appendChild(main);
      row.appendChild(el("div", "entry-amount " + e.type, (e.type === "income" ? "+" : "-") + formatMoney(e.amount)));

      var actions = el("div", "entry-actions");
      var editBtn = el("button", "small secondary", "✏️");
      editBtn.title = "Edit";
      editBtn.addEventListener("click", function () {
        entryDraft = {
          id: e.id,
          type: e.type,
          amount: e.amount,
          date: e.date,
          categoryId: e.categoryId || (state.categories[0] ? state.categories[0].id : ""),
          paymentMethod: e.paymentMethod || "",
          sourceName: e.sourceName || "",
          note: e.note || "",
          _showMore: true
        };
        currentTab = "add";
        render();
      });
      var delBtn = el("button", "small danger", "✕");
      delBtn.title = "Delete";
      delBtn.addEventListener("click", function () {
        if (confirm("Delete this entry?")) deleteEntry(e.id);
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);
      panel.appendChild(row);
    });
  }
  app.appendChild(panel);
}

// ----- Settings -----

function renderSettings() {
  app.appendChild(renderAccountLine());

  var generalPanel = el("div", "panel");
  generalPanel.appendChild(el("h2", null, "⚙️ General"));
  var currencyField = field("Currency symbol", (function () {
    var input = document.createElement("input");
    input.type = "text";
    input.maxLength = 3;
    input.style.maxWidth = "80px";
    input.value = state.currencySymbol;
    input.addEventListener("input", function () {
      state.currencySymbol = input.value || "₹";
      saveState();
    });
    return input;
  })());
  generalPanel.appendChild(currencyField);
  app.appendChild(generalPanel);

  var catPanel = el("div", "panel");
  catPanel.appendChild(el("h2", null, "🏷️ Categories & budgets"));
  catPanel.appendChild(el("p", "panel-hint", "Set a monthly budget (optional) per category to track it on the Dashboard. Leave budget at 0 for no limit."));

  state.categories.forEach(function (cat) {
    if (editingCategoryId === cat.id) {
      catPanel.appendChild(renderCategoryEditForm(cat));
      return;
    }
    var row = el("div", "cat-row");
    row.appendChild(iconBadge(cat.emoji));
    row.appendChild(el("div", "cat-name", escapeHtml(cat.name)));
    row.appendChild(el("div", "cat-budget", cat.budget > 0 ? "Budget: " + formatMoney(cat.budget) : "No budget"));
    var actions = el("div", "row-actions");
    var editBtn = el("button", "small secondary", "Edit");
    editBtn.addEventListener("click", function () { editingCategoryId = cat.id; render(); });
    var delBtn = el("button", "small danger", "Delete");
    delBtn.addEventListener("click", function () {
      if (confirm('Delete category "' + cat.name + '"? Past entries keep their record but will show as deleted.')) deleteCategory(cat.id);
    });
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    row.appendChild(actions);
    catPanel.appendChild(row);
  });

  catPanel.appendChild(renderNewCategoryForm());
  app.appendChild(catPanel);
}

function renderCategoryEditForm(cat) {
  var wrap = el("div", "cat-row");
  var emojiIn = document.createElement("input");
  emojiIn.value = cat.emoji;
  emojiIn.maxLength = 4;
  emojiIn.style.maxWidth = "60px";
  var nameIn = document.createElement("input");
  nameIn.value = cat.name;
  nameIn.style.flex = "1 1 140px";
  var budgetIn = document.createElement("input");
  budgetIn.type = "number";
  budgetIn.min = "0";
  budgetIn.step = "0.01";
  budgetIn.placeholder = "Budget";
  budgetIn.value = cat.budget || "";
  budgetIn.style.maxWidth = "120px";
  var saveBtn = el("button", "small", "Save");
  saveBtn.addEventListener("click", function () {
    if (!nameIn.value.trim()) return;
    upsertCategory({ id: cat.id, name: nameIn.value.trim(), emoji: emojiIn.value.trim() || "⭐", budget: Number(budgetIn.value) || 0 });
    editingCategoryId = null;
    render();
  });
  var cancelBtn = el("button", "small secondary", "Cancel");
  cancelBtn.addEventListener("click", function () { editingCategoryId = null; render(); });
  wrap.appendChild(emojiIn);
  wrap.appendChild(nameIn);
  wrap.appendChild(budgetIn);
  wrap.appendChild(saveBtn);
  wrap.appendChild(cancelBtn);
  return wrap;
}

function renderNewCategoryForm() {
  var wrap = el("div", "cat-row");
  var palette = el("div", null);
  var emojiIn = document.createElement("input");
  emojiIn.value = newCategoryDraft.emoji;
  emojiIn.maxLength = 4;
  emojiIn.style.maxWidth = "60px";
  emojiIn.addEventListener("input", function () { newCategoryDraft.emoji = emojiIn.value; });
  var nameIn = document.createElement("input");
  nameIn.placeholder = "New category name";
  nameIn.style.flex = "1 1 140px";
  nameIn.value = newCategoryDraft.name;
  nameIn.addEventListener("input", function () { newCategoryDraft.name = nameIn.value; });
  var budgetIn = document.createElement("input");
  budgetIn.type = "number";
  budgetIn.min = "0";
  budgetIn.step = "0.01";
  budgetIn.placeholder = "Budget (optional)";
  budgetIn.style.maxWidth = "140px";
  budgetIn.value = newCategoryDraft.budget;
  budgetIn.addEventListener("input", function () { newCategoryDraft.budget = budgetIn.value; });
  var addBtn = el("button", "small", "Add category");
  addBtn.addEventListener("click", function () {
    if (!nameIn.value.trim()) return;
    upsertCategory({ id: genId("cat"), name: nameIn.value.trim(), emoji: emojiIn.value.trim() || "⭐", budget: Number(budgetIn.value) || 0 });
    newCategoryDraft = { name: "", emoji: "⭐", budget: "" };
    render();
  });
  wrap.appendChild(emojiIn);
  wrap.appendChild(nameIn);
  wrap.appendChild(budgetIn);
  wrap.appendChild(addBtn);
  return wrap;
}

// ---------- Init ----------

render();
initFirebase();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      // Safari in particular can sit on a stale cached version for a long
      // time otherwise - this forces a check against the network every
      // load, then reloads once the new version actually takes over.
      reg.update().catch(function () {});
      reg.addEventListener("updatefound", function () {
        var installing = reg.installing;
        if (!installing) return;
        installing.addEventListener("statechange", function () {
          if (installing.state === "activated" && navigator.serviceWorker.controller) {
            location.reload();
          }
        });
      });
    }).catch(function () {});

    var reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloadedForUpdate) return;
      reloadedForUpdate = true;
      location.reload();
    });
  });
}

})();
</script>
