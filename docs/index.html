<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tomorrow's Bag 🎒</title>
<style>
  :root {
    --bg1: #fff4e0;
    --bg2: #e0f7ff;
    --card: #ffffff;
    --ink: #2d2a3d;
    --muted: #7a7690;
    --accent: #ff8fab;
    --accent2: #6fd6ff;
    --good: #58c66b;
    --radius: 22px;
    --shadow: 0 6px 0 rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Comic Sans MS", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px 18px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mode-toggle {
    display: flex;
    background: var(--card);
    border-radius: 999px;
    padding: 4px;
    box-shadow: var(--shadow);
  }
  .mode-toggle button {
    border: none;
    background: transparent;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: white;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }

  .date-banner {
    text-align: center;
    padding: 6px 0 2px;
  }
  .date-banner .big {
    font-size: 1.6rem;
    font-weight: 800;
  }
  .date-banner .sub {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 2px;
  }
  .today-line {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .holiday-banner {
    background: #fff3cd;
    border: 2px solid #ffe08a;
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-weight: 700;
    text-align: center;
  }
  .holiday-banner .small {
    display: block;
    font-weight: 500;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .subject-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  @media (min-width: 480px) {
    .subject-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .subject-card {
    position: relative;
    border: 3px solid transparent;
    border-radius: 18px;
    padding: 14px 6px 10px;
    text-align: center;
    cursor: pointer;
    background: var(--tint, #f2f2f2);
    user-select: none;
    transition: transform .08s ease;
  }
  .subject-card:active { transform: scale(0.95); }
  .subject-card .emoji {
    font-size: 2.1rem;
    line-height: 1;
    display: block;
  }
  .subject-card .name {
    margin-top: 6px;
    font-weight: 700;
    font-size: 0.85rem;
  }
  .subject-card.selected {
    border-color: var(--good);
    background: #e9fbee;
  }
  .subject-card .check {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--good);
    color: white;
    font-size: 0.9rem;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .subject-card.selected .check { display: flex; }

  .note-field {
    margin-top: 18px;
  }
  .note-field label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  .note-field input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 2px solid #eee;
    font-size: 1rem;
    font-family: inherit;
  }

  .big-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), #ff6b8b);
    color: white;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 0 #c94f6d;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c94f6d; }
  .big-btn.secondary {
    background: linear-gradient(135deg, var(--accent2), #4fb8e8);
    box-shadow: 0 5px 0 #3a8fb8;
  }
  .big-btn.secondary:active { box-shadow: 0 2px 0 #3a8fb8; }

  .confirm {
    text-align: center;
    padding: 10px;
  }
  .confirm .emoji-row { font-size: 2.4rem; margin-bottom: 6px; }
  .confirm h2 { margin: 6px 0; }
  .confirm ul {
    list-style: none;
    padding: 0;
    margin: 14px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .confirm li {
    background: #f2f2f2;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
  }

  section h3 {
    margin: 0 0 10px;
    font-size: 1.05rem;
  }

  .parent-summary-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0 0;
  }
  .parent-summary-list span {
    background: #f2f2f2;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.88rem;
  }
  .parent-note {
    margin-top: 10px;
    font-style: italic;
    color: var(--muted);
  }

  .profile-field {
    margin-top: 10px;
  }
  .profile-field label {
    display: block;
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 4px;
  }
  .profile-field input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #eee;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .profile-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 480px) {
    .profile-grid { grid-template-columns: 1fr 1fr; }
  }

  .kid-greet {
    font-size: 1.1rem;
    font-weight: 800;
    text-align: center;
  }
  .class-tag {
    color: var(--muted);
    font-weight: 700;
  }

  .weekday-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 10px;
  }
  .weekday-row button {
    flex: 0 0 auto;
    border: 2px solid #eee;
    background: white;
    border-radius: 12px;
    padding: 8px 10px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--muted);
  }
  .weekday-row button.active {
    border-color: var(--accent2);
    color: var(--ink);
    background: #eafaff;
  }

  .subject-mini {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #f2f2f2;
    border-radius: 999px;
    padding: 6px 10px 6px 10px;
    margin: 4px 4px 0 0;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .subject-mini.on {
    border-color: var(--good);
    background: #e9fbee;
  }
  .subject-mini .rm {
    color: #c0392b;
    margin-left: 4px;
    cursor: pointer;
  }

  .add-subject-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .add-subject-form input {
    padding: 10px 12px;
    border-radius: 12px;
    border: 2px solid #eee;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .add-subject-form input.emoji-in { width: 60px; text-align: center; font-size: 1.2rem; }
  .add-subject-form input.name-in { flex: 1; min-width: 120px; }
  .add-subject-form button {
    padding: 10px 16px;
    border-radius: 12px;
    border: none;
    background: var(--ink);
    color: white;
    font-weight: 700;
    cursor: pointer;
  }
  .add-subject-form button.cancel {
    background: #eee;
    color: var(--ink);
  }

  .subject-mini .edit {
    color: #4a90d9;
    margin-left: 6px;
    cursor: pointer;
  }

  .country-field {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .country-field label {
    font-weight: 700;
    font-size: 0.9rem;
  }
  .country-field select {
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid #eee;
    font-size: 0.9rem;
    font-family: inherit;
  }

  .emoji-palette {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 4px;
  }
  .emoji-palette button {
    font-size: 1.2rem;
    border: none;
    background: #f2f2f2;
    border-radius: 10px;
    padding: 6px 8px;
    cursor: pointer;
  }

  .history-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .hdate {
    font-weight: 800;
    font-size: 0.9rem;
  }
  .history-item .hnote {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
    margin-top: 2px;
  }
  .empty-hint {
    color: var(--muted);
    text-align: center;
    padding: 10px;
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 10px;
  }

  .confetti-piece {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    z-index: 999;
    pointer-events: none;
    animation: fall linear forwards;
    border-radius: 2px;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎒 Tomorrow's Bag</h1>
    <div class="mode-toggle">
      <button id="btnKid" class="active">🧒 Kid</button>
      <button id="btnParent">🧑 Parent</button>
    </div>
  </header>

  <div id="app"></div>

  <footer>Saved on this device only 💾 · Made with ❤️ for packing bags without the morning rush</footer>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "notebookTracker.v1";

  // ---- Optional cross-device sync (Firebase Firestore) ----
  // Leave this null to keep the app exactly as before: fully local, no
  // internet dependency, data stays on the one device/browser it's used on.
  // Fill it in with a Firebase project's config (from the Firebase console
  // → Project settings → your web app) to sync one shared family record
  // live across every device that opens this page.
  var FIREBASE_CONFIG = null;
  /* Example:
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSy...",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "...",
    appId: "..."
  };
  */
  var FIREBASE_SDK_VERSION = "10.14.1";

  var cloud = { docRef: null, setDoc: null, ready: false };
  var applyingRemoteUpdate = false;

  function initCloudSync() {
    if (!FIREBASE_CONFIG) return;
    Promise.all([
      import("https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/" + FIREBASE_SDK_VERSION + "/firebase-firestore.js")
    ]).then(function (mods) {
      var appMod = mods[0], fsMod = mods[1];
      var app = appMod.initializeApp(FIREBASE_CONFIG);
      var db = fsMod.getFirestore(app);
      cloud.docRef = fsMod.doc(db, "notebookTracker", "family");
      cloud.setDoc = fsMod.setDoc;
      cloud.ready = true;
      render();
      fsMod.onSnapshot(cloud.docRef, function (snap) {
        if (!snap.exists()) {
          pushCloudUpdate();
          return;
        }
        var remote = snap.data();
        if (JSON.stringify(remote) === JSON.stringify(state)) return;
        applyingRemoteUpdate = true;
        state = remote;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        render();
        applyingRemoteUpdate = false;
      }, function (err) {
        console.warn("Cloud sync: listen failed", err);
      });
    }).catch(function (err) {
      console.warn("Cloud sync: unavailable", err);
    });
  }

  function pushCloudUpdate() {
    if (!cloud.ready || applyingRemoteUpdate) return;
    cloud.setDoc(cloud.docRef, state).catch(function (err) {
      console.warn("Cloud sync: push failed", err);
    });
  }

  var DEFAULT_SUBJECTS = [
    { id: "math", name: "Math", emoji: "🔢" },
    { id: "science", name: "Science", emoji: "🔬" },
    { id: "english", name: "English", emoji: "📖" },
    { id: "hindi", name: "Hindi", emoji: "✍️" },
    { id: "social", name: "Social Studies", emoji: "🌍" },
    { id: "computer", name: "Computer", emoji: "💻" },
    { id: "art", name: "Art", emoji: "🎨" },
    { id: "evs", name: "EVS", emoji: "🌱" },
    { id: "gk", name: "GK", emoji: "🧠" },
    { id: "library", name: "Library", emoji: "📚" },
    { id: "pe", name: "PE / Sports", emoji: "⚽" },
    { id: "music", name: "Music", emoji: "🎵" }
  ];

  var TINTS = ["#ffe3ec", "#e3f7ff", "#fff4d6", "#e8ffe3", "#efe3ff", "#ffe9e0", "#e3fff6", "#fdeaff"];

  var WEEKDAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var WEEKDAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  var EMOJI_PALETTE = ["📕","📗","📘","📙","📓","📔","🧮","🔬","🎨","🎵","⚽","🏀","💻","🧠","🌍","🌱","✍️","📚","🧪","⭐","🧵","🎭","🗺️","🧩"];

  var COUNTRY_OPTIONS = [
    { code: "", label: "Off (no holiday check)" },
    { code: "IN", label: "🇮🇳 India" },
    { code: "US", label: "🇺🇸 United States" },
    { code: "GB", label: "🇬🇧 United Kingdom" },
    { code: "CA", label: "🇨🇦 Canada" },
    { code: "AU", label: "🇦🇺 Australia" },
    { code: "SG", label: "🇸🇬 Singapore" },
    { code: "AE", label: "🇦🇪 UAE" }
  ];

  // Seeded from DPS Gurgaon's published "List of Holidays 2026-27"
  // (dpsgurgaon.org/list-of-holidays.php). Editable/removable in Parent mode.
  var DEFAULT_SCHOOL_HOLIDAYS = [
    { date: "2026-03-26", name: "Ram Navami" },
    { date: "2026-03-31", name: "Mahavir Jayanti" },
    { date: "2026-04-03", name: "Good Friday" },
    { date: "2026-04-14", name: "Ambedkar Jayanti / Baisakhi" },
    { date: "2026-04-19", name: "Parshuram Jayanti" },
    { date: "2026-05-01", name: "Buddha Purnima" },
    { date: "2026-05-27", name: "Id-Ul-Zuha (Bakrid)" },
    { date: "2026-07-31", name: "Shaheed Udham Singh Martyrdom Day" },
    { date: "2026-08-15", name: "Independence Day" },
    { date: "2026-08-26", name: "Milad-Un-Nabi" },
    { date: "2026-08-28", name: "Raksha Bandhan" },
    { date: "2026-09-04", name: "Janmashtami" },
    { date: "2026-09-23", name: "Shaheedi Diwas" },
    { date: "2026-10-02", name: "Gandhi Jayanti" },
    { date: "2026-10-11", name: "Maharaja Agrasen Jayanti" },
    { date: "2026-10-20", name: "Dusshera" },
    { date: "2026-10-26", name: "Valmiki Jayanti" },
    { date: "2026-11-01", name: "Haryana Day" },
    { date: "2026-11-08", name: "Diwali" },
    { date: "2026-11-24", name: "Guru Nanak Birthday" },
    { date: "2026-12-25", name: "Christmas" },
    { date: "2027-01-23", name: "Sir Chhotu Ram Jayanti" },
    { date: "2027-01-26", name: "Republic Day" },
    { date: "2027-03-06", name: "Maha Shivaratri*" },
    { date: "2027-03-07", name: "Maha Shivaratri*" },
    { date: "2027-03-10", name: "Id-Ul-Fitr" },
    { date: "2027-03-22", name: "Holi" },
    { date: "2027-03-23", name: "Shaheed Bhagat Singh Martyrdom Day" },
    { date: "2027-03-26", name: "Good Friday" }
  ];

  function buildDefaultSchoolHolidays() {
    return DEFAULT_SCHOOL_HOLIDAYS.map(function (h, i) {
      return { id: "sh_seed_" + i, date: h.date, name: h.name };
    });
  }

  // In-memory cache only (not persisted) so holiday data is always fresh next visit.
  var holidayCache = {};

  function fetchHolidays(year, countryCode) {
    var cacheKey = countryCode + "-" + year;
    if (holidayCache[cacheKey] !== undefined) return;
    holidayCache[cacheKey] = "loading";
    fetch("https://date.nager.at/api/v3/publicholidays/" + year + "/" + countryCode)
      .then(function (res) { if (!res.ok) throw new Error("bad response"); return res.json(); })
      .then(function (data) {
        holidayCache[cacheKey] = Array.isArray(data) ? data : [];
        render();
      })
      .catch(function () {
        holidayCache[cacheKey] = null; // fetch failed / unavailable — fail silently, non-blocking
        render();
      });
  }

  function getHolidayForDate(d, countryCode) {
    if (!countryCode) return undefined;
    var year = d.getFullYear();
    var cacheKey = countryCode + "-" + year;
    var cached = holidayCache[cacheKey];
    if (cached === undefined) {
      fetchHolidays(year, countryCode);
      return undefined;
    }
    if (!cached || cached === "loading") return undefined;
    var key = dateKey(d);
    for (var i = 0; i < cached.length; i++) {
      if (cached[i].date === key) return cached[i];
    }
    return null;
  }

  function getUpcomingHolidays(countryCode, count) {
    if (!countryCode) return { status: "off", holidays: [] };
    var today = todayDate();
    var year = today.getFullYear();
    var thisYear = holidayCache[countryCode + "-" + year];
    var nextYear = holidayCache[countryCode + "-" + (year + 1)];
    if (thisYear === undefined) fetchHolidays(year, countryCode);
    if (nextYear === undefined) fetchHolidays(year + 1, countryCode);
    var combined = [];
    if (Array.isArray(thisYear)) combined = combined.concat(thisYear);
    if (Array.isArray(nextYear)) combined = combined.concat(nextYear);
    var todayKey = dateKey(today);
    combined = combined.filter(function (h) { return h.date >= todayKey; });
    combined.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    combined = combined.slice(0, count);

    var anyLoading = thisYear === undefined || thisYear === "loading" || nextYear === undefined || nextYear === "loading";
    var anyFailed = thisYear === null || nextYear === null;
    var status = combined.length ? "ready" : (anyLoading ? "loading" : (anyFailed ? "failed" : "ready"));
    return { status: status, holidays: combined };
  }

  function formatShortDate(key) {
    var parts = key.split("-");
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " (" + WEEKDAY_SHORT[d.getDay()] + ")";
  }

  function getSchoolHolidayForDate(d) {
    var key = dateKey(d);
    for (var i = 0; i < state.schoolHolidays.length; i++) {
      if (state.schoolHolidays[i].date === key) return state.schoolHolidays[i];
    }
    return null;
  }

  function getUpcomingSchoolHolidays(count) {
    var todayKey = dateKey(todayDate());
    return state.schoolHolidays
      .filter(function (h) { return h.date >= todayKey; })
      .sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); })
      .slice(0, count);
  }

  function addSchoolHoliday(dateStr, name) {
    name = (name || "").trim();
    if (!dateStr || !name) return;
    state.schoolHolidays = state.schoolHolidays.filter(function (h) { return h.date !== dateStr; });
    state.schoolHolidays.push({ id: "sh_" + Date.now() + "_" + Math.floor(Math.random() * 1000), date: dateStr, name: name });
    saveState();
    render();
  }

  function removeSchoolHoliday(id) {
    state.schoolHolidays = state.schoolHolidays.filter(function (h) { return h.id !== id; });
    saveState();
    render();
  }

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.subjects) return parsed;
      } catch (e) {}
    }
    return {
      subjects: DEFAULT_SUBJECTS.slice(),
      weeklyPlan: {},
      entries: {},
      countryCode: "IN",
      profile: { kidName: "", kidClass: "", parentName: "", schoolLocation: "Gurgaon, Haryana" },
      schoolHolidays: buildDefaultSchoolHolidays()
    };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    pushCloudUpdate();
  }

  var state = loadState();
  if (state.countryCode === undefined) state.countryCode = "IN";
  if (!state.profile) state.profile = { kidName: "", kidClass: "", parentName: "", schoolLocation: "" };
  if (state.profile.schoolLocation === undefined) state.profile.schoolLocation = "";
  if (!Array.isArray(state.schoolHolidays)) state.schoolHolidays = buildDefaultSchoolHolidays();
  var mode = "kid";
  var draftSelection = null;
  var draftNote = null;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function tomorrowDate() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 1);
    return d;
  }
  function formatLong(d) {
    return WEEKDAY_NAMES[d.getDay()] + ", " + d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  }
  function todayDate() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function subjectById(id) {
    for (var i = 0; i < state.subjects.length; i++) {
      if (state.subjects[i].id === id) return state.subjects[i];
    }
    return null;
  }

  function ensureDraft() {
    var d = tomorrowDate();
    var key = dateKey(d);
    var existing = state.entries[key];
    if (draftSelection === null) {
      draftSelection = existing ? existing.items.slice() : suggestForDate(d);
    }
    if (draftNote === null) {
      draftNote = existing ? (existing.note || "") : "";
    }
    return key;
  }

  function suggestForDate(d) {
    var plan = state.weeklyPlan[d.getDay()];
    if (plan && plan.length) {
      return plan.filter(function (id) { return !!subjectById(id); });
    }
    return [];
  }

  function toggleDraftSubject(id) {
    var idx = draftSelection.indexOf(id);
    if (idx >= 0) draftSelection.splice(idx, 1);
    else draftSelection.push(id);
    render();
  }

  function saveEntry() {
    var key = ensureDraft();
    state.entries[key] = { items: draftSelection.slice(), note: draftNote, savedAt: Date.now() };
    saveState();
    draftSelection = null;
    draftNote = null;
    render(true);
    launchConfetti();
  }

  function launchConfetti() {
    var colors = ["#ff8fab", "#6fd6ff", "#ffd166", "#58c66b", "#c792ea"];
    for (var i = 0; i < 26; i++) {
      (function () {
        var piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = (Math.random() * 100) + "vw";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        var duration = 1.4 + Math.random() * 1.2;
        piece.style.animationDuration = duration + "s";
        document.body.appendChild(piece);
        setTimeout(function () { piece.remove(); }, duration * 1000 + 100);
      })();
    }
  }

  function addSubject(name, emoji) {
    name = (name || "").trim();
    emoji = (emoji || "").trim() || "⭐";
    if (!name) return;
    var id = "s_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    state.subjects.push({ id: id, name: name, emoji: emoji });
    saveState();
    render();
  }

  function removeSubject(id) {
    state.subjects = state.subjects.filter(function (s) { return s.id !== id; });
    Object.keys(state.weeklyPlan).forEach(function (day) {
      state.weeklyPlan[day] = (state.weeklyPlan[day] || []).filter(function (sid) { return sid !== id; });
    });
    saveState();
    render();
  }

  function renameSubject(id, name, emoji) {
    name = (name || "").trim();
    emoji = (emoji || "").trim() || "⭐";
    if (!name) return;
    var s = subjectById(id);
    if (!s) return;
    s.name = name;
    s.emoji = emoji;
    saveState();
    render();
  }

  function setCountryCode(code) {
    state.countryCode = code;
    saveState();
    render();
  }

  function setProfileField(field, value) {
    state.profile[field] = value;
    saveState();
    // No render() here on purpose — these fields are edited via free text input,
    // and re-rendering on every keystroke would rebuild the DOM and drop focus.
  }

  function toggleWeeklyPlanSubject(day, id) {
    if (!state.weeklyPlan[day]) state.weeklyPlan[day] = [];
    var arr = state.weeklyPlan[day];
    var idx = arr.indexOf(id);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(id);
    saveState();
    render();
  }

  // ---------- Rendering ----------

  var app = document.getElementById("app");
  var titleEl = document.querySelector("header h1");
  var btnKid = document.getElementById("btnKid");
  var btnParent = document.getElementById("btnParent");

  btnKid.addEventListener("click", function () { mode = "kid"; render(); });
  btnParent.addEventListener("click", function () { mode = "parent"; render(); });

  function render(justSaved) {
    btnKid.classList.toggle("active", mode === "kid");
    btnParent.classList.toggle("active", mode === "parent");
    titleEl.textContent = state.profile.kidName ? "🎒 " + state.profile.kidName + "'s Bag" : "🎒 Tomorrow's Bag";
    app.innerHTML = "";
    if (mode === "kid") {
      renderKid(justSaved);
    } else {
      renderParent();
    }
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderKid(justSaved) {
    var d = tomorrowDate();
    var key = dateKey(d);
    var alreadySaved = !!state.entries[key];

    if (justSaved) {
      app.appendChild(el("div", "today-line", "📅 Today: " + formatLong(todayDate())));
    app.appendChild(el("div", "today-line", cloud.ready ? "☁️ Synced across devices" : (FIREBASE_CONFIG ? "🔌 Connecting…" : "💾 Saved on this device only")));
      var entry = state.entries[key];
      var card = el("div", "card confirm");
      card.appendChild(el("div", "emoji-row", "🎉🎒✨"));
      card.appendChild(el("h2", null, "All packed for tomorrow!"));
      card.appendChild(el("div", null, formatLong(d)));
      var ul = el("ul");
      entry.items.forEach(function (id) {
        var s = subjectById(id);
        if (s) ul.appendChild(el("li", null, s.emoji + " " + s.name));
      });
      if (entry.items.length === 0) {
        ul.appendChild(el("li", null, "Nothing selected"));
      }
      card.appendChild(ul);
      if (entry.note) {
        var noteP = el("div", "parent-note", "📝 " + escapeHtml(entry.note));
        card.appendChild(noteP);
      }
      var editBtn = el("button", "big-btn secondary", "✏️ Change my answer");
      editBtn.addEventListener("click", function () {
        draftSelection = entry.items.slice();
        draftNote = entry.note || "";
        state.entries[key] = undefined;
        delete state.entries[key];
        saveState();
        render();
      });
      card.appendChild(editBtn);
      app.appendChild(card);
      return;
    }

    ensureDraft();

    app.appendChild(el("div", "today-line", "📅 Today: " + formatLong(todayDate())));
    app.appendChild(el("div", "today-line", cloud.ready ? "☁️ Synced across devices" : (FIREBASE_CONFIG ? "🔌 Connecting…" : "💾 Saved on this device only")));

    var schoolHoliday = getSchoolHolidayForDate(d);
    if (schoolHoliday) {
      app.appendChild(el("div", "holiday-banner", "🏫 No school tomorrow: " + escapeHtml(schoolHoliday.name)));
    } else {
      var holiday = getHolidayForDate(d, state.countryCode);
      if (holiday) {
        var hb = el("div", "holiday-banner", "🎉 Tomorrow might be a holiday: " + escapeHtml(holiday.localName || holiday.name));
        hb.appendChild(el("span", "small", "Double-check with a parent — school might still be open!"));
        app.appendChild(hb);
      }
    }

    var banner = el("div", "card date-banner");
    if (state.profile.kidName) {
      banner.appendChild(el("div", "kid-greet", "👋 Hi, " + escapeHtml(state.profile.kidName) + "!"));
    }
    banner.appendChild(el("div", "big", "🌟 What are you bringing tomorrow?"));
    var subText = formatLong(d);
    var subLine = el("div", "sub", escapeHtml(subText));
    if (state.profile.kidClass) {
      subLine.appendChild(el("span", "class-tag", " · 🏫 " + escapeHtml(state.profile.kidClass)));
    }
    banner.appendChild(subLine);
    app.appendChild(banner);

    var gridCard = el("div", "card");
    var grid = el("div", "subject-grid");
    state.subjects.forEach(function (s, i) {
      var selected = draftSelection.indexOf(s.id) >= 0;
      var c = el("div", "subject-card" + (selected ? " selected" : ""));
      c.style.setProperty("--tint", TINTS[i % TINTS.length]);
      c.appendChild(el("div", "check", "✓"));
      c.appendChild(el("span", "emoji", s.emoji));
      c.appendChild(el("span", "name", escapeHtml(s.name)));
      c.addEventListener("click", function () { toggleDraftSubject(s.id); });
      grid.appendChild(c);
    });
    gridCard.appendChild(grid);

    var noteWrap = el("div", "note-field");
    noteWrap.appendChild(el("label", null, "📝 Anything else to remember?"));
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "like PE shoes or a water bottle";
    input.value = draftNote || "";
    input.addEventListener("input", function () { draftNote = input.value; });
    noteWrap.appendChild(input);
    gridCard.appendChild(noteWrap);

    var saveBtn = el("button", "big-btn", alreadySaved ? "🎒 Save my changes!" : "🎒 All Packed!");
    saveBtn.addEventListener("click", saveEntry);
    gridCard.appendChild(saveBtn);

    app.appendChild(gridCard);
  }

  function renderParent() {
    var d = tomorrowDate();
    var key = dateKey(d);
    var entry = state.entries[key];

    app.appendChild(el("div", "today-line", "📅 Today: " + formatLong(todayDate())));
    app.appendChild(el("div", "today-line", cloud.ready ? "☁️ Synced across devices" : (FIREBASE_CONFIG ? "🔌 Connecting…" : "💾 Saved on this device only")));

    var parentSchoolHoliday = getSchoolHolidayForDate(d);
    if (parentSchoolHoliday) {
      app.appendChild(el("div", "holiday-banner", "🏫 No school tomorrow: " + escapeHtml(parentSchoolHoliday.name)));
    } else {
      var holiday = getHolidayForDate(d, state.countryCode);
      if (holiday) {
        var hb = el("div", "holiday-banner", "🎉 Tomorrow might be a public holiday: " + escapeHtml(holiday.localName || holiday.name));
        hb.appendChild(el("span", "small", "Based on a general public holiday calendar — always confirm against your school's own calendar."));
        app.appendChild(hb);
      }
    }

    // Names & class
    var profileCard = el("div", "card");
    profileCard.appendChild(el("h3", null, "👤 Names & class"));
    var profileGrid = el("div", "profile-grid");

    var kidNameField = el("div", "profile-field");
    kidNameField.appendChild(el("label", null, "🧒 Kid's name"));
    var kidNameIn = document.createElement("input");
    kidNameIn.type = "text";
    kidNameIn.placeholder = "e.g. Zara";
    kidNameIn.value = state.profile.kidName || "";
    kidNameIn.addEventListener("input", function () { setProfileField("kidName", kidNameIn.value); titleEl.textContent = kidNameIn.value ? "🎒 " + kidNameIn.value + "'s Bag" : "🎒 Tomorrow's Bag"; });
    kidNameField.appendChild(kidNameIn);
    profileGrid.appendChild(kidNameField);

    var kidClassField = el("div", "profile-field");
    kidClassField.appendChild(el("label", null, "🏫 Kid's class / grade"));
    var kidClassIn = document.createElement("input");
    kidClassIn.type = "text";
    kidClassIn.placeholder = "e.g. Grade 4B";
    kidClassIn.value = state.profile.kidClass || "";
    kidClassIn.addEventListener("input", function () { setProfileField("kidClass", kidClassIn.value); });
    kidClassField.appendChild(kidClassIn);
    profileGrid.appendChild(kidClassField);

    var parentNameField = el("div", "profile-field");
    parentNameField.appendChild(el("label", null, "🧑 Parent's name"));
    var parentNameIn = document.createElement("input");
    parentNameIn.type = "text";
    parentNameIn.placeholder = "e.g. Tanvi";
    parentNameIn.value = state.profile.parentName || "";
    parentNameIn.addEventListener("input", function () { setProfileField("parentName", parentNameIn.value); });
    parentNameField.appendChild(parentNameIn);
    profileGrid.appendChild(parentNameField);

    var schoolLocationField = el("div", "profile-field");
    schoolLocationField.appendChild(el("label", null, "📍 School location"));
    var schoolLocationIn = document.createElement("input");
    schoolLocationIn.type = "text";
    schoolLocationIn.placeholder = "e.g. Gurgaon, Haryana";
    schoolLocationIn.value = state.profile.schoolLocation || "";
    schoolLocationIn.addEventListener("input", function () { setProfileField("schoolLocation", schoolLocationIn.value); });
    schoolLocationField.appendChild(schoolLocationIn);
    profileGrid.appendChild(schoolLocationField);

    profileCard.appendChild(profileGrid);
    app.appendChild(profileCard);

    var summary = el("div", "card");
    summary.appendChild(el("h3", null, "🎒 Tomorrow — " + formatLong(d)));
    if (entry && entry.items.length) {
      var list = el("div", "parent-summary-list");
      entry.items.forEach(function (id) {
        var s = subjectById(id);
        if (s) list.appendChild(el("span", null, s.emoji + " " + s.name));
      });
      summary.appendChild(list);
      if (entry.note) summary.appendChild(el("div", "parent-note", "📝 " + escapeHtml(entry.note)));
    } else if (entry) {
      summary.appendChild(el("div", "empty-hint", "Nothing selected yet — nudge your little one! 😊"));
    } else {
      summary.appendChild(el("div", "empty-hint", "Not filled in yet — ask your kid to open Kid mode! 🧒"));
    }

    var countryField = el("div", "country-field");
    countryField.appendChild(el("label", null, "🌍 Public holiday check:"));
    var select = document.createElement("select");
    COUNTRY_OPTIONS.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt.code;
      o.textContent = opt.label;
      if (opt.code === (state.countryCode || "")) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener("change", function () { setCountryCode(select.value); });
    countryField.appendChild(select);
    summary.appendChild(countryField);
    summary.appendChild(el("div", "parent-note", "Best-effort only — this is a national public holiday calendar, not your specific school's calendar" + (state.profile.schoolLocation ? " for " + escapeHtml(state.profile.schoolLocation) : "") + ", so state/local school holidays won't show up here. Always double-check with the school."));

    app.appendChild(summary);

    // School holidays (manually entered — no public API covers this)
    var schoolHolCard = el("div", "card");
    schoolHolCard.appendChild(el("h3", null, "🏫 School holidays"));
    schoolHolCard.appendChild(el("div", "parent-note", "Pre-loaded with DPS Gurgaon's published 2026–27 holiday list. There's no public API for school-specific holidays — edit names, remove any that don't apply, or add more from the school's own calendar/circular. These take priority over the general public holiday guess below."));

    var upcomingSchoolHolidays = getUpcomingSchoolHolidays(state.schoolHolidays.length);
    if (!upcomingSchoolHolidays.length) {
      schoolHolCard.appendChild(el("div", "empty-hint", "No upcoming dates added yet."));
    } else {
      var shList = el("div");
      upcomingSchoolHolidays.forEach(function (h) {
        var row = el("span", "subject-mini on", formatShortDate(h.date) + " — " + escapeHtml(h.name));
        var rm = el("span", "rm", "✕");
        rm.addEventListener("click", function (ev) {
          ev.stopPropagation();
          removeSchoolHoliday(h.id);
        });
        row.appendChild(rm);
        shList.appendChild(row);
      });
      schoolHolCard.appendChild(shList);
    }

    var shForm = el("div", "add-subject-form");
    var shDateIn = document.createElement("input");
    shDateIn.type = "date";
    var shNameIn = document.createElement("input");
    shNameIn.className = "name-in";
    shNameIn.placeholder = "Occasion (e.g. Diwali Break)";
    var shAddBtn = document.createElement("button");
    shAddBtn.textContent = "Add";
    shAddBtn.addEventListener("click", function () {
      addSchoolHoliday(shDateIn.value, shNameIn.value);
    });
    shForm.appendChild(shDateIn);
    shForm.appendChild(shNameIn);
    shForm.appendChild(shAddBtn);
    schoolHolCard.appendChild(shForm);
    app.appendChild(schoolHolCard);

    if (state.countryCode) {
      var holidayListCard = el("div", "card");
      holidayListCard.appendChild(el("h3", null, "🗓️ Upcoming public holidays"));
      var upcomingResult = getUpcomingHolidays(state.countryCode, 6);
      if (upcomingResult.holidays.length) {
        var hList = el("div");
        upcomingResult.holidays.forEach(function (h) {
          var row = el("div", "history-item");
          row.appendChild(el("div", "hdate", formatShortDate(h.date)));
          row.appendChild(el("div", null, escapeHtml(h.localName || h.name)));
          hList.appendChild(row);
        });
        holidayListCard.appendChild(hList);
      } else if (upcomingResult.status === "loading") {
        holidayListCard.appendChild(el("div", "empty-hint", "Loading holiday calendar…"));
      } else if (upcomingResult.status === "failed") {
        holidayListCard.appendChild(el("div", "empty-hint", "Couldn't reach the holiday service — check your internet connection."));
      } else {
        holidayListCard.appendChild(el("div", "empty-hint", "No upcoming holidays found for this calendar."));
      }
      app.appendChild(holidayListCard);
    }

    // Weekly plan editor
    var planCard = el("div", "card");
    planCard.appendChild(el("h3", null, "📅 Usual weekly plan"));
    planCard.appendChild(el("div", "parent-note", "Set what's usually needed each day — it'll be suggested to your kid automatically."));
    var dayRow = el("div", "weekday-row");
    var selectedDay = renderParent._selectedDay;
    if (selectedDay === undefined) selectedDay = new Date().getDay();
    WEEKDAY_SHORT.forEach(function (label, idx) {
      var b = document.createElement("button");
      b.textContent = label;
      if (idx === selectedDay) b.classList.add("active");
      b.addEventListener("click", function () {
        renderParent._selectedDay = idx;
        render();
      });
      dayRow.appendChild(b);
    });
    planCard.appendChild(dayRow);

    var planList = el("div");
    var dayPlan = state.weeklyPlan[selectedDay] || [];
    state.subjects.forEach(function (s) {
      var on = dayPlan.indexOf(s.id) >= 0;
      var chip = el("span", "subject-mini" + (on ? " on" : ""), s.emoji + " " + escapeHtml(s.name));
      chip.addEventListener("click", function () { toggleWeeklyPlanSubject(selectedDay, s.id); });
      planList.appendChild(chip);
    });
    planCard.appendChild(planList);
    app.appendChild(planCard);

    // Manage subjects
    var subCard = el("div", "card");
    subCard.appendChild(el("h3", null, "🧾 Manage notebook list"));
    subCard.appendChild(el("div", "parent-note", "Tap ✏️ to rename a subject or change its icon."));
    var editingId = renderParent._editingId || null;
    var subList = el("div");
    state.subjects.forEach(function (s) {
      if (s.id === editingId) {
        var editForm = el("div", "add-subject-form");
        var eEmojiIn = document.createElement("input");
        eEmojiIn.className = "emoji-in";
        eEmojiIn.value = s.emoji;
        eEmojiIn.maxLength = 4;
        var eNameIn = document.createElement("input");
        eNameIn.className = "name-in";
        eNameIn.value = s.name;
        var eSaveBtn = document.createElement("button");
        eSaveBtn.textContent = "Save";
        eSaveBtn.addEventListener("click", function () {
          renameSubject(s.id, eNameIn.value, eEmojiIn.value);
          renderParent._editingId = null;
        });
        var eCancelBtn = document.createElement("button");
        eCancelBtn.className = "cancel";
        eCancelBtn.textContent = "Cancel";
        eCancelBtn.addEventListener("click", function () {
          renderParent._editingId = null;
          render();
        });
        editForm.appendChild(eEmojiIn);
        editForm.appendChild(eNameIn);
        editForm.appendChild(eSaveBtn);
        editForm.appendChild(eCancelBtn);
        subList.appendChild(editForm);
        return;
      }
      var chip = el("span", "subject-mini on", s.emoji + " " + escapeHtml(s.name));
      var editIcon = el("span", "edit", "✏️");
      editIcon.addEventListener("click", function (ev) {
        ev.stopPropagation();
        renderParent._editingId = s.id;
        render();
      });
      chip.appendChild(editIcon);
      var rm = el("span", "rm", "✕");
      rm.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (confirm('Remove "' + s.name + '"?')) removeSubject(s.id);
      });
      chip.appendChild(rm);
      subList.appendChild(chip);
    });
    subCard.appendChild(subList);

    var palette = el("div", "emoji-palette");
    var chosenEmoji = renderParent._chosenEmoji || "⭐";
    EMOJI_PALETTE.forEach(function (e) {
      var b = document.createElement("button");
      b.textContent = e;
      b.addEventListener("click", function () {
        renderParent._chosenEmoji = e;
        render();
      });
      palette.appendChild(b);
    });
    subCard.appendChild(palette);

    var form = el("div", "add-subject-form");
    var emojiIn = document.createElement("input");
    emojiIn.className = "emoji-in";
    emojiIn.value = chosenEmoji;
    emojiIn.maxLength = 4;
    var nameIn = document.createElement("input");
    nameIn.className = "name-in";
    nameIn.placeholder = "New subject name";
    var addBtn = document.createElement("button");
    addBtn.textContent = "Add";
    addBtn.addEventListener("click", function () {
      addSubject(nameIn.value, emojiIn.value);
      renderParent._chosenEmoji = "⭐";
    });
    form.appendChild(emojiIn);
    form.appendChild(nameIn);
    form.appendChild(addBtn);
    subCard.appendChild(form);
    app.appendChild(subCard);

    // History
    var histCard = el("div", "card");
    histCard.appendChild(el("h3", null, "📜 History"));
    var keys = Object.keys(state.entries).filter(function (k) { return state.entries[k]; }).sort().reverse();
    if (!keys.length) {
      histCard.appendChild(el("div", "empty-hint", "No history yet."));
    } else {
      keys.slice(0, 21).forEach(function (k) {
        var e = state.entries[k];
        var parts = k.split("-");
        var dd = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        var item = el("div", "history-item");
        var names = e.items.map(function (id) {
          var s = subjectById(id);
          return s ? s.emoji + " " + s.name : null;
        }).filter(Boolean).join("  ");
        item.appendChild(el("div", "hdate", formatLong(dd)));
        item.appendChild(el("div", null, names || "Nothing selected"));
        if (e.note) item.appendChild(el("div", "hnote", "📝 " + escapeHtml(e.note)));
        histCard.appendChild(item);
      });
    }
    app.appendChild(histCard);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  render();
  initCloudSync();
})();
</script>
</body>
</html>
