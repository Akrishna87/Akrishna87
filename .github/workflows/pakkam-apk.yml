name: Pakkam APK

on:
  push:
    paths:
      - "pakkam-android/**"
      - ".github/workflows/pakkam-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pakkam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pakkam-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Offline dictionary (Open English WordNet 2025, CC BY 4.0)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/oewn.xml.gz" \
            https://github.com/globalwordnet/english-wordnet/releases/download/2025-edition/english-wordnet-2025.xml.gz
          echo "9ca6d1dcb75f822fdd66617f7d9da48142ace38dd544d6ad5e2feca1674ad3fe  $RUNNER_TEMP/oewn.xml.gz" | sha256sum -c -
          mkdir -p app/src/main/assets
          python3 ci/build_dictionary.py "$RUNNER_TEMP/oewn.xml.gz" app/src/main/assets/dictionary.db
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            echo "=== Errors ==="
            grep -E '^e: |error:|FAILED|What went wrong' -A2 build.log | sed 's|file:///home/runner/work/Akrishna87/Akrishna87/pakkam-android/app/src/main/java/io/github/akrishna87/pakkam/||' | tail -120
          fi
          exit $status
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Pakkam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pakkam-apk
          path: pakkam-android/Pakkam.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pakkam-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash pakkam-android/ci/smoke-test.sh apk/Pakkam.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pakkam-smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pakkam-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: pakkam-smoke-test-screens
          path: smoke
      - name: Publish the APK as the "pakkam-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p out/screens
          cp smoke/*.png out/screens/ 2>/dev/null || true
          apk=out/Pakkam.apk
          cat > out/version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apk": "Pakkam.apk",
            "sha256": "$(sha256sum "$apk" | cut -d' ' -f1)",
            "size": $(stat -c %s "$apk")
          }
          JSON
          gh release delete pakkam-latest --cleanup-tag --yes || true
          gh release create pakkam-latest "$apk" out/version.json out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Pakkam for Android (build ${{ github.run_number }})" \
            --notes "Download **Pakkam.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
