name: Pakkam APK

on:
  push:
    paths:
      - "pakkam-android/**"
      - ".github/workflows/pakkam-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pakkam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pakkam-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            echo "=== Errors ==="
            grep -E '^e: |error:|FAILED|What went wrong' -A2 build.log | sed 's|file:///home/runner/work/Akrishna87/Akrishna87/pakkam-android/app/src/main/java/io/github/akrishna87/pakkam/||' | tail -120
          fi
          exit $status
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Pakkam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pakkam-apk
          path: pakkam-android/Pakkam.apk
