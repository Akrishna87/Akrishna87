name: Pakkam APK

on:
  push:
    paths:
      - "pakkam-android/**"
      - ".github/workflows/pakkam-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pakkam-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pakkam-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Pakkam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pakkam-apk
          path: pakkam-android/Pakkam.apk
