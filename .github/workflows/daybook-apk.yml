name: Daybook APK

on:
  push:
    paths:
      - "daybook-android/**"
      - ".github/workflows/daybook-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daybook-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daybook-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Daybook.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-apk
          path: daybook-android/Daybook.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Daybook-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash daybook-android/ci/smoke-test.sh apk/Daybook.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daybook-smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Daybook-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: daybook-smoke-test-screens
          path: out/screens
      - name: Publish the APK as the "daybook-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete daybook-latest --cleanup-tag --yes || true
          gh release create daybook-latest out/Daybook.apk out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Daybook for Android (build ${{ github.run_number }})" \
            --notes "Download **Daybook.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
