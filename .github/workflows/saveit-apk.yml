name: SaveIt APK

on:
  push:
    paths:
      - "saveit-android/**"
      - ".github/workflows/saveit-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saveit-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saveit-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Name the APKs
        run: |
          out=app/build/outputs/apk/release
          mkdir -p apks
          cp "$out/app-arm64-v8a-release.apk" apks/SaveIt.apk
          cp "$out/app-armeabi-v7a-release.apk" apks/SaveIt-older-phones.apk
          cp "$out/app-x86_64-release.apk" apks/SaveIt-x86_64.apk
          ls -lh apks
      - uses: actions/upload-artifact@v4
        with:
          name: SaveIt-apks
          path: saveit-android/apks

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SaveIt-apks
          path: apk
      - name: Install ffmpeg for the test song
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash saveit-android/ci/smoke-test.sh apk/SaveIt-x86_64.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saveit-smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SaveIt-apks
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: saveit-smoke-test-screens
          path: out/screens
      - name: Publish the APK as the "saveit-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete saveit-latest --cleanup-tag --yes || true
          gh release create saveit-latest out/SaveIt.apk out/SaveIt-older-phones.apk out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SaveIt for Android (build ${{ github.run_number }})" \
            --notes "Download **SaveIt.apk** on your Android phone, open it, and allow installing from your browser when asked. (Only if your phone is very old and SaveIt.apk won't install, use **SaveIt-older-phones.apk** instead.) Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
