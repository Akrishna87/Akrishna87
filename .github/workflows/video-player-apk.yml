name: Video player APK

on:
  push:
    paths:
      - "video-player-android/**"
      - ".github/workflows/video-player-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-player-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-player-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk MyVideos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyVideos-apk
          path: video-player-android/MyVideos.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MyVideos-apk
          path: apk
      - name: Make test videos
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p videos
          for i in 1 2 3; do
            ffmpeg -loglevel error -f lavfi -i "testsrc=size=640x360:rate=25:duration=40" \
              -f lavfi -i "sine=frequency=$((300 + i * 110)):duration=40" \
              -c:v libx264 -pix_fmt yuv420p -preset veryfast -c:a aac -shortest "videos/Smoke Video $i.mp4"
          done
          # A tall phone video, which should play upright
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=360x640:rate=25:duration=40" \
            -f lavfi -i "sine=frequency=660:duration=40" \
            -c:v libx264 -pix_fmt yuv420p -preset veryfast -c:a aac -shortest "videos/Smoke Portrait.mp4"
          ls -la videos
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash video-player-android/ci/smoke-test.sh apk/MyVideos.apk videos smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyVideos-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: video-smoke-test-screens
          path: out/screens
      - name: Publish the APK as the "video-player-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete video-player-latest --cleanup-tag --yes || true
          gh release create video-player-latest out/MyVideos.apk out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "My Videos for Android (build ${{ github.run_number }})" \
            --notes "Download **MyVideos.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
